[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "webdav-rfc4918-client"
description = "WebDAV client library with an fsspec-based filesystem and a CLI"
readme = "README.md"
keywords = [ "fsspec", "webdav", "webdav-cli", "webdav-client" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Saugat Pachhai", email = "suagatchhetri@outlook.com" } ]
maintainers = [ { name = "Manfred Kaiser", email = "manfred.kaiser@ssh-mitm.at" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [ "httpx<1,>=0.26.0", "python-dateutil>=2.8.1" ]
optional-dependencies.all = [ "webdav-rfc4918-client[fsspec,http2]" ]
optional-dependencies.dev = [ "webdav-rfc4918-client[docs,fsspec,http2,qa,tests]" ]
optional-dependencies.docs = [
  "furo==2025.12.19",
  "myst-parser>=3,<6",
  "sphinx>=7,<10",
  "sphinx-copybutton==0.5.2",
]
optional-dependencies.fsspec = [ "fsspec>=2021.7" ]
optional-dependencies.http2 = [ "httpx[http2]<1,>=0.26.0" ]
optional-dependencies.qa = [
  "bandit",
  "mypy==1.19.1",
  "pre-commit",
  "types-colorama",
  "types-python-dateutil",
]
optional-dependencies.tests = [
  "cheroot",
  "colorama",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "typing-extensions",
  "wsgidav",
]
urls."Bug Tracker" = "https://github.com/manfred-kaiser/webdav4/issues"
urls."Source Code" = "https://github.com/manfred-kaiser/webdav4"
scripts.dav = "webdav.cli:main"

[tool.hatch]
build.hooks.vcs.version-file = "src/webdav/_version.py"
build.targets.wheel.packages = [ "src/webdav" ]
version.source = "vcs"

[tool.ruff]
show-fixes = true
format.preview = true
format.docstring-code-format = true
lint.select = [ "ALL" ]
lint.ignore = [
  "CPY001", # missing-copyright-notice - LICENSE already carries it, no per-file headers used
  "D401",   # non-imperative-mood - docstring grammar, no effect on correctness/behavior
  "ISC001", # single-line-implicit-string-concatenation, incompatible with ruff format
]
lint.explicit-preview-rules = true
lint.per-file-ignores."docs/**" = [ "INP001" ]
lint.per-file-ignores."src/webdav/cli.py" = [ "T201" ] # it's a CLI, printing to stdout is the point
lint.per-file-ignores."tests/**" = [
  "ANN",     # return/argument types not required on test functions
  "DTZ002",
  "PGH003",  # blanket `type: ignore` is fine in tests
  "PLR2004", # magic values in test data/assertions are normal
  "S101",    # assert is the standard pytest idiom
  "S106",
  "S314",
  "SLF001",  # tests intentionally reach into internals to set up scenarios
]
lint.per-file-ignores."tests/server.py" = [ "T201" ] # interactive REPL helper, not library code
lint.flake8-annotations.allow-star-arg-any = true # **kwargs passthrough to httpx is legitimately dynamic
lint.flake8-type-checking.strict = true
lint.isort.known-first-party = [ "webdav" ]
lint.preview = true

[tool.bandit]
# B101 (assert): every use in src/ is an internal type-narrowing check,
# individually reviewed - not input validation or a security boundary.
# B405 (blacklisted xml import): stdlib ElementTree never resolves external
# entities and modern expat (>=2.4.0) rejects billion-laughs amplification
# by default - verified empirically, not just assumed (same reasoning as
# the inline "nosec B314" on the actual parse call).
skips = [ "B101", "B405" ]

[tool.codespell]
ignore-words-list = "cachable"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.pytest]
ini_options.addopts = "-ra -nauto -cov=src,tests"

[tool.coverage]
run.branch = true
run.concurrency = [ "multiprocessing" ]
run.parallel = true
run.source = [ "tests", "webdav" ]
paths.source = [ "src", "*/site-packages" ]
report.exclude_lines = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "pass",
  "pragma: no cover",
  "raise NotImplementedError",
]
report.show_missing = true

[tool.mypy]
show_column_numbers = true
# be strict
disallow_untyped_calls = true
warn_return_any = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
files = [ "src/webdav", "tests", "docs" ]
disallow_untyped_defs = true
disallow_incomplete_defs = true
overrides = [
  { module = [
    "_version",
    "fsspec.*",
    "wsgidav.*",
    "IPython",
  ], ignore_missing_imports = true },
  { module = [
    "tests.*",
  ], disallow_untyped_defs = false, disallow_incomplete_defs = false, warn_unused_ignores = false },
]
